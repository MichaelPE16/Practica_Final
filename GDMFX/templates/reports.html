{%extends 'base.html'%}

{%block content%}
<div class="container-fluid py-4">
    <h1 class="text-light mb-4">Reporting Dashboard</h1>

    <!-- Control Panel -->
    <div class="card bg-dark border-secondary mb-4 shadow-sm">
        <div class="card-body">
            <form method="GET" action="{% url 'reports' %}">
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label for="module" class="form-label text-light">Module</label>
                        <select name="module" id="module" class="form-select bg-dark text-light border-secondary">
                            <option value="sales" {% if current_module == 'sales' %}selected{% endif %}>Sales</option>
                            <option value="leads" {% if current_module == 'leads' %}selected{% endif %}>Leads</option>
                            <option value="inventory" {% if current_module == 'inventory' %}selected{% endif %}>Inventory (Vehicles)</option>
                            <option value="contracts" {% if current_module == 'contracts' %}selected{% endif %}>Contracts</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="start_date" class="form-label text-light">Start Date</label>
                        <input type="date" name="start_date" id="start_date" class="form-control bg-dark text-light border-secondary" value="{{ start_date }}">
                    </div>
                    <div class="col-md-2">
                        <label for="end_date" class="form-label text-light">End Date</label>
                        <input type="date" name="end_date" id="end_date" class="form-control bg-dark text-light border-secondary" value="{{ end_date }}">
                    </div>
                    <div class="col-md-3">
                        <label for="search" class="form-label text-light">Search</label>
                        <input type="text" name="search" id="search" class="form-control bg-dark text-light border-secondary" placeholder="Search criteria..." value="{{ search_query }}">
                    </div>
                    <div class="col-md-2 d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-grow-1">Filter</button>
                        <button type="submit" name="export" value="csv" class="btn btn-success flex-grow-1">CSV</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Data Display -->
    <div class="card bg-dark border-secondary shadow-sm">
        <div class="card-body bg-dark text-light p-0">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead>
                        <tr>
                            {% for header in table_headers %}
                            <th>{{ header }}</th>
                            {% endfor %}
                        </tr>
                    </thead>
                    <tbody>
                        {% for row_id, data in table_rows %}
                        <tr>
                            {% for cell in data %}
                            <td>{{ cell }}</td>
                            {% endfor %}
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="{{ table_headers|length|default:1 }}" class="text-center text-muted py-4">No data found matching your criteria.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{%endblock%}
