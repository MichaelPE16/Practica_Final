{%extends 'base.html'%}

{%block content%}
<div class="container mt-3">
    <div class="card shadow border-secondary bg-dark text-white" style="width: 50%; margin: 0 auto;">
        <div class="card-header">Nuevo Lead</div>
        <div class="card-body">
            <form method="post">
                {%csrf_token%}
                {{form.as_p}}
                <div class="d-flex justify-content-between">
                    <a href="javascript:history.back()" class="btn btn-outline-danger">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{%endblock%}
