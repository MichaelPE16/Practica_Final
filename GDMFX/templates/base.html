<!DOCTYPE html>
<html lang="en">


<head>
    {%load static%}
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" type="image/png" href="https://img.icons8.com/?size=100&id=Atb5mR0Y5hAu&format=png&color=000000">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <title>GDMFX</title>



</head>


<body>
    <!--Here we go over the navbar section-->
    {% if user.is_authenticated%}
    <div class="wrapper">
        <aside id="sidebar">
            <div class="d-flex">
                <button id="toggle-btn" type="button">
                    <i class="fa-solid fa-list"></i>
                </button>
                <div class="sidebar-logo">
                    <a href="{%url 'dashboard'%}">GDMFX</a>
                </div>
            </div>
            <ul class="sidebar-nav">
                <li class="sidebar-item">
                    <a href="{%url 'dashboard'%}" class="sidebar-link">
                        <i class="fa-regular fa-table-columns"></i>
                        <span>Dashboard</span>
                    </a>

                </li>
                <li class="sidebar-item">
                    <a href="{%url 'contract'%}" class="sidebar-link">
                        <i class="fa-solid fa-file-signature"></i>
                        <span>Contracts</span>
                    </a>

                </li>
                <li class="sidebar-item">
                    <a href="{%url 'inventory'%}" class="sidebar-link">
                        <i class="fa-solid fa-warehouse"></i>
                        <span>Inventory</span>
                    </a>

                </li>
                <li class="sidebar-item">
                    <a href="{%url 'leads'%}" class="sidebar-link">
                        <i class="fa-solid fa-fire"></i>
                        <span>Leads</span>
                    </a>

                </li>
                <li class="sidebar-item">
                    <a href="{%url 'sales'%}" class="sidebar-link">
                        <i class="fa-solid fa-dollar-sign"></i>
                        <span>Sales</span>
                    </a>

                </li>
                <li class="sidebar-item">
                    <a href="{%url 'meets'%}" class="sidebar-link">
                        <i class="fa-solid fa-people-arrows"></i>
                        <span>Meets</span>
                    </a>

                </li>
                <li class="sidebar-item">
                    <a href="{%url 'reports'%}" class="sidebar-link">
                        <i class="fa-solid fa-file-zipper"></i>
                        <span>Reports</span>
                    </a>

                </li>

            </ul>

            <div class="sidebar-footer">
                <a href="{%url 'logout'%}" class="sidebar-link">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </a>
            </div>


        </aside>
    </div>
    {%else%}

    {%endif%}

    <!-- style -->
    <style>
        /* ======================================================= */
        /* ESTILOS PARA LA SINCRONIZACIÓN DEL SIDEBAR Y EL CONTENIDO */
        /* ======================================================= */

        /* 1. Estilos iniciales para el contenido principal */
        .main {
            /* Define el margen inicial igual al ancho colapsado del sidebar (70px) */
            margin-left: 70px;

            /* Permite que el movimiento sea suave */
            transition: margin-left 0.15s ease-in-out;

            /* Asegura que ocupe el espacio restante y evita scroll horizontal */
            width: auto;
            overflow-x: hidden;
            padding: 20px;
            /* Puedes agregar un padding aquí si lo necesitas */
        }

        /* 2. Mueve el contenido cuando el BODY tiene la clase 'sidebar-expanded' */
        body.sidebar-expanded .main {
            /* Margen igual al ancho expandido del sidebar (260px) */
            margin-left: 260px;
        }

        /* ---------------------------------------------------- */
        /* **IMPORTANTE:** Mueve tus estilos de base aquí. */
        /* Por ejemplo, tus estilos para #sidebar, .wrapper, etc. */
        /* ---------------------------------------------------- */

        #sidebar {
            width: 70px;
            min-width: 70px;
            z-index: 1000;
            transition: all .15s ease-in-out;
            /* ... otros estilos de #sidebar ... */
            position: fixed;
            top: 0;
            bottom: 0;
            height: 100%;
            left: 0;
        }

        #sidebar.expand {
            width: 260px;
            min-width: 260px;
        }

        /* ... el resto de tu CSS va aquí ... */
    </style>

    <!--rest of the content coming from other pages-->
    <div class="main">
        <div class="container">
            {% block content%}
            {% endblock%}
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="https://kit.fontawesome.com/22cd97cc6f.js" crossorigin="anonymous"></script>
    <!-- <script>
        const hambuerger = document.querySelector("#toggle-btn");
        hambuerger.addEventListener("click", function () {
            document.querySelector("#sidebar").classList.toggle("expand");
        })
    </script> -->
    <script>
        const hambuerger = document.querySelector("#toggle-btn");
        hambuerger.addEventListener("click", function () {
            // 1. Toglea la clase 'expand' en el #sidebar (para el CSS de su ancho)
            document.querySelector("#sidebar").classList.toggle("expand");

            // 2. Toglea la clase 'sidebar-expanded' en el BODY (para mover el .main)
            document.body.classList.toggle("sidebar-expanded");
        })
    </script>

</body>

</html>
