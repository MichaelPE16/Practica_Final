<!DOCTYPE html>
<html lang="en">


<head>
    {%load static%}
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" type="image/png" href="https://img.icons8.com/?size=100&id=Atb5mR0Y5hAu&format=png&color=000000">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <title>GDMFX</title>



</head>


<body>
    <!--Here we go over the navbar section-->
    <div class="wrapper">
        <aside id="sidebar">
            <div class="d-flex">
                <button id="toggle-btn" type="button">
                    <i class="fa-solid fa-list"></i>
                </button>
                <div class="sidebar-logo">
                    <a href="#">GDMFX</a>
                </div>
            </div>
            <ul class="sidebar-nav">
                <li class="sidebar-item">
                    <a href="#" class="sidebar-link">
                        <i class="fa-regular fa-table-columns"></i>
                        <span>Dashboard</span>
                    </a>

                </li>
                <li class="sidebar-item">
                    <a href="#" class="sidebar-link">
                        <i class="fa-solid fa-file-signature"></i>
                        <span>Contracts</span>
                    </a>

                </li>
                <li class="sidebar-item">
                    <a href="#" class="sidebar-link">
                        <i class="fa-solid fa-warehouse"></i>
                        <span>Inventory</span>
                    </a>

                </li>
                <li class="sidebar-item">
                    <a href="#" class="sidebar-link">
                        <i class="fa-solid fa-fire"></i>
                        <span>Leads</span>
                    </a>

                </li>
                <li class="sidebar-item">
                    <a href="#" class="sidebar-link">
                        <i class="fa-solid fa-dollar-sign"></i>
                        <span>Sales</span>
                    </a>

                </li>
                <li class="sidebar-item">
                    <a href="#" class="sidebar-link">
                        <i class="fa-solid fa-people-arrows"></i>
                        <span>Meets</span>
                    </a>

                </li>
                <li class="sidebar-item">
                    <a href="#" class="sidebar-link">
                        <i class="fa-solid fa-file-zipper"></i>
                        <span>Reports</span>
                    </a>

                </li>

            </ul>

            <div class="sidebar-footer">
                <a href="#" class="sidebar-link">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </a>
            </div>


        </aside>
    </div>


    <!--rest of the content coming from other pages-->
    {% block content%}

    {% endblock%}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="https://kit.fontawesome.com/22cd97cc6f.js" crossorigin="anonymous"></script>
    <script>
        const hambuerger = document.querySelector("#toggle-btn");
        hambuerger.addEventListener("click", function () {
            document.querySelector("#sidebar").classList.toggle("expand");
        })
    </script>

</body>

</html>
