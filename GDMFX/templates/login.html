{%extends 'base.html'%}

{%block auth_content%}
<div class="row w-100 justify-content-center">
    <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="card card-premium border-0">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-white">Welcome Back</h2>
                    <p class="text-white small">Sign in to continue to GDMFX</p>
                </div>

                {%if error%}
                <div class="alert alert-danger text-center mb-4 text-small" role="alert">
                    <i class="fa-solid fa-circle-exclamation me-2"></i> {{error}}
                </div>
                {%endif%}

                <form method="POST">
                    {%csrf_token%}

                    <div class="mb-3">
                        <label class="form-label" for="username">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary"><i
                                    class="fa-solid fa-user"></i></span>
                            <input type="text" name="username" class="form-control bg-dark text-light border-secondary"
                                id="username" placeholder="Enter your username" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary"><i
                                    class="fa-solid fa-lock"></i></span>
                            <input type="password" name="password"
                                class="form-control bg-dark text-light border-secondary" id="password"
                                placeholder="Enter your password" required>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button class="btn btn-primary py-2 fw-bold" type="submit">Login</button>
                    </div>

                    <div class="text-center mt-4">
                        <span class="text-white">New to GDMFX?</span>
                        <a href="{%url 'signup'%}" class="fw-bold ms-1">Create Account</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{%endblock%}
