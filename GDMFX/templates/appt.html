<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://img.icons8.com/?size=100&id=Atb5mR0Y5hAu&format=png&color=000000">

    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/home.css' %}?v=5">

    <!-- Google Fonts & FontAwesome 6 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Flatpickr (Date Picker) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">

    <title>Book an Appointment | GDMFX</title>

    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
        }

        .booking-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 0;
            background: radial-gradient(circle at top right, #1a1a1a, #121212);
        }

        .tracking-wider {
            letter-spacing: 0.05em;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }
    </style>
</head>

<body>

    <!-- Professional Navigation (Same as Home) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
                <i class="fa-solid fa-car-side me-2 text-primary"></i>
                <span class="fw-bold tracking-tight">GDMFX<span class="text-primary">CRM</span></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                    <li class="nav-item mx-2">
                        <a class="nav-link" href="{% url 'home' %}">Back to Home</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="booking-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-10 col-lg-8 col-xl-6">
                    {% include 'appt_inner.html' %}
                </div>
            </div>
        </div>
    </div>

    <!-- Footer (Same as Home) -->
    <footer class="bg-black py-5 border-top border-dark">
        <div class="container text-center">
            <div class="mb-4">
                <i class="fa-solid fa-car-side fa-3x text-primary opacity-50"></i>
                <h4 class="text-white mt-2">ELITE<span class="text-primary">CRM</span></h4>
            </div>
            <p class="text-secondary small">Empowering dealerships with smart technology. All information subject to
                database validation.</p>
            <p class="text-secondary extra-small">&copy; 2025 Elite Dealer Systems. Professional CRM Infrastructure.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Initialize Flatpickr for DateTime fields (Customer perspective)
            flatpickr(".datetimepicker", {
                enableTime: true,
                dateFormat: "Y-m-d H:i",
                allowInput: true,
                altInput: true,
                altFormat: "F j, Y H:i",
                theme: "dark",
                minDate: "today",
            });
        });
    </script>
</body>

</html>
