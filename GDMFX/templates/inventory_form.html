{%extends 'base.html'%}

{%block content%}
<div class="container mt-3">
    <div class="card shadow border-secondary bg-dark text-white" style="width: 50%; margin: 0 auto;">
        <div class="card-header">Nuevo Vehículo {{error}}</div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">

                {%csrf_token%}
                {{form.as_p}}

                <div class="mb-3">
                    <label for="images" class="form-label">Upload Images (Gallery)</label>
                    <input class="form-control bg-dark text-white border-secondary" type="file" id="images"
                        name="images" multiple>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="javascript:history.back()" class="btn btn-outline-danger">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{%endblock%}
