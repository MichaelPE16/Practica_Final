{% extends 'base.html' %}

{% block content %}
<div class="container mt-3">
    <div class="card shadow border-0" style="width: 50%; margin: 0 auto;">
        <div class="card-header">Actualizar Contrato</div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-flex justify-content-between">
                    <a href="{% url 'contract' %}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
