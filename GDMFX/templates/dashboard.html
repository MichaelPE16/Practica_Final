{%extends 'base.html'%}
{%block page_title%}Dashboard{%endblock%}
{%block content%}
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="row mb-4">
    <!-- Slicers Form -->
    <div class="col-12">
        <div class="card card-dark">
            <div class="card-body">
                <form method="GET" action="{%url 'dashboard'%}" class="row g-3">
                    <div class="col-md-3">
                        <label for="start_date" class="form-label text-light">Start Date</label>
                        <input type="text" class="form-control bg-black text-light border-secondary datepicker"
                            id="start_date" name="start_date" value="{{start_date}}"
                            placeholder="Select start date...">
                    </div>
                    <div class="col-md-3">
                        <label for="end_date" class="form-label text-light">End Date</label>
                        <input type="text" class="form-control bg-black text-light border-secondary datepicker"
                            id="end_date" name="end_date" value="{{end_date}}" placeholder="Select end date...">
                    </div>
                    <div class="col-md-3">
                        <label for="brand" class="form-label text-light">Brand</label>
                        <select class="form-select bg-black text-light border-secondary" id="brand" name="brand">
                            <option value="All Brands" {%if 'All Brands' in active_brands_list%}selected {%endif%}>
                                All Brands</option>
                            {%for b in all_brands%}
                            <option value="{{b}}" {%if b in active_brands_list%}selected{%endif%}>{{b}}</option>
                            {%endfor%}
                        </select>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fa-solid fa-filter me-2"></i>Apply Filters
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- KPIs -->
<div class="row mb-4 g-3">
    <div class="col-md-3">
        <div class="card card-dark text-center h-100">
            <div class="card-body d-flex flex-column justify-content-center">
                <h6 class="card-subtitle mb-2 text-secondary text-uppercase fw-bold">Total Sales (Closed)</h6>
                <h2 class="text-light fw-bold mb-0">{{total_sales}}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card card-dark text-center h-100">
            <div class="card-body d-flex flex-column justify-content-center">
                <h6 class="card-subtitle mb-2 text-secondary text-uppercase fw-bold">Total Revenue</h6>
                <h2 class="text-success fw-bold mb-0">${{total_revenue}}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card card-dark text-center h-100">
            <div class="card-body d-flex flex-column justify-content-center">
                <h6 class="card-subtitle mb-2 text-secondary text-uppercase fw-bold">Active Leads</h6>
                <h2 class="text-info fw-bold mb-0">{{total_leads}}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card card-dark text-center h-100">
            <div class="card-body d-flex flex-column justify-content-center">
                <h6 class="card-subtitle mb-2 text-secondary text-uppercase fw-bold">Inventory Value</h6>
                <h2 class="text-warning fw-bold mb-0">${{inventory_value}}</h2>
            </div>
        </div>
    </div>
</div>

<!-- Charts Row 1 -->
<div class="row mb-4 g-3">
    <div class="col-md-8">
        <div class="card card-dark h-100">
            <div class="card-body">
                <canvas id="revenueChart" style="max-height: 400px;"></canvas>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card card-dark h-100">
            <div class="card-body">
                <canvas id="leadStatusChart" style="max-height: 400px;"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- Charts Row 2 -->
<div class="row mb-4 g-3">
    <div class="col-md-6">
        <div class="card card-dark h-100">
            <div class="card-body">
                <canvas id="scatterChart" style="max-height: 400px;"></canvas>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card card-dark h-100">
            <div class="card-body">
                <canvas id="inventoryChart" style="max-height: 400px;"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    Chart.defaults.color = '#e0e0e0';
    Chart.defaults.font.family = 'Inter, sans-serif';

    // 1. Revenue Chart
    const revLabels = JSON.parse('{{ sales_trend_labels_json|escapejs }}');
    const revData = JSON.parse('{{ sales_trend_values_json|escapejs }}');
    if (revLabels.length > 0) {
        new Chart(document.getElementById('revenueChart'), {
            type: 'line',
            data: {
                labels: revLabels,
                datasets: [{
                    label: 'Revenue Trend ($)',
                    data: revData,
                    borderColor: '#0d6efd',
                    backgroundColor: 'rgba(13, 110, 253, 0.2)',
                    fill: true,
                    tension: 0.1
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    // 2. Lead Status Chart
    const leadLabels = JSON.parse('{{ lead_status_labels_json|escapejs }}');
    const leadData = JSON.parse('{{ lead_status_values_json|escapejs }}');
    if (leadLabels.length > 0) {
        new Chart(document.getElementById('leadStatusChart'), {
            type: 'doughnut',
            data: {
                labels: leadLabels,
                datasets: [{
                    data: leadData,
                    backgroundColor: ['#20c997', '#0dcaf0', '#0d6efd', '#6f42c1', '#d63384'],
                    borderWidth: 0
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, cutout: '60%', plugins: { title: {display: true, text: 'Leads by Status'} } }
        });
    }

    // 3. Scatter Chart
    const scatterJson = JSON.parse('{{ scatter_data_json|escapejs }}');
    const datasets = [];
    if (scatterJson.length > 0) {
        const grouped = {};
        const colors = ['#0d6efd', '#6610f2', '#6f42c1', '#d63384', '#dc3545', '#fd7e14', '#ffc107', '#198754', '#20c997', '#0dcaf0'];
        scatterJson.forEach(d => {
            if (!grouped[d.brand]) grouped[d.brand] = [];
            grouped[d.brand].push(d);
        });
        let colorIdx = 0;
        for (const brand in grouped) {
            datasets.push({
                label: brand,
                data: grouped[brand],
                backgroundColor: colors[colorIdx % colors.length]
            });
            colorIdx++;
        }
        new Chart(document.getElementById('scatterChart'), {
            type: 'scatter',
            data: { datasets: datasets },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    title: { display: true, text: 'Price vs Mileage (Used)' },
                    tooltip: {
                        callbacks: {
                            label: function(ctx) { return ctx.raw.vehicle_name + ': $' + ctx.raw.y + ' at ' + ctx.raw.x + 'km'; }
                        }
                    }
                },
                scales: {
                    x: { title: { display: true, text: 'Km' } },
                    y: { title: { display: true, text: 'Selling Price ($)' } }
                }
            }
        });
    }

    // 4. Inventory by Brand
    const invLabels = JSON.parse('{{ inventory_labels_json|escapejs }}');
    const invData = JSON.parse('{{ inventory_values_json|escapejs }}');
    if (invLabels.length > 0) {
        new Chart(document.getElementById('inventoryChart'), {
            type: 'bar',
            data: {
                labels: invLabels,
                datasets: [{
                    label: 'Available Quantity',
                    data: invData,
                    backgroundColor: 'rgba(32, 201, 151, 0.7)',
                    borderColor: '#20c997',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { title: { display: true, text: 'Available Inventory by Brand' } },
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
            }
        });
    }
});
</script>

{%endblock%}
