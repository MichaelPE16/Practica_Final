
{% extends 'base.html' %}

{% block content %}
<div class="container mt-3">
    <div class="card shadow border-0" style="width: 50%; margin: 0 auto; background-color: rgb(194, 200, 206);">
        <div class="card-header">Actualizar Vehículo</div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-flex justify-content-between">
                    <a href="{% url 'inventory' %}" class="btn btn-outline-danger">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
