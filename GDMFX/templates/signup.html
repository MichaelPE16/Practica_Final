{% extends 'base.html' %}

{% block auth_content %}
<div class="row w-100 justify-content-center">
    <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="card card-premium border-0">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-white">Join GDMFX</h2>
                    <p class="text-muted small">Create your dealer account today</p>
                </div>

                {% if error %}
                <div class="alert alert-danger text-center mb-4 text-small" role="alert">
                    <i class="fa-solid fa-circle-exclamation me-2"></i> {{ error }}
                </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label" for="username">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary"><i
                                    class="fa-solid fa-user"></i></span>
                            <input type="text" name="username" class="form-control bg-dark text-light border-secondary"
                                id="username" placeholder="Choose a username" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="password1">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary"><i
                                    class="fa-solid fa-lock"></i></span>
                            <input type="password" name="password1"
                                class="form-control bg-dark text-light border-secondary" id="password1"
                                placeholder="Enter your password" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="password2">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary"><i
                                    class="fa-solid fa-lock"></i></span>
                            <input type="password" name="password2"
                                class="form-control bg-dark text-light border-secondary" id="password2"
                                placeholder="Repeat your password" required>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button class="btn btn-primary py-2 fw-bold" type="submit">Create Account</button>
                    </div>

                    <div class="text-center mt-4">
                        <span class="text-muted">Already have an account?</span>
                        <a href="{% url 'login' %}" class="fw-bold ms-1">Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
